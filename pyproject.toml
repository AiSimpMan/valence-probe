[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "valence-probe"
version = "0.1.0"
description = "Neutral activation-steering experiments for user-defined semantic directions"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8"]
model = ["transformers>=4.51.0", "torch>=2.1"]

[project.scripts]
valence-probe = "valence_probe.cli:main"

[tool.setuptools.packages.find]
include = ["valence_probe*"]
